[/Script/UnrealEd.ProjectPackagingSettings]
; Project-owned industrial meshes and their material instance replace the
; engine BasicShapes in both saved map shells and runtime compatibility paths.
+DirectoriesToAlwaysCook=(Path="/Game/Environment")
; Runtime combat/music fallback paths resolve generated cues by object path.
; Keep the complete project-owned audio directory in cooked packages so hit
; confirmation and other dynamically loaded cues cannot disappear from a
; standalone build.
+DirectoriesToAlwaysCook=(Path="/Game/Audio")
; Environment weather accents and combat VFX are resolved by soft object path.
; Keep their Niagara packages in standalone builds for rain/snow and impact
; presentation instead of relying on editor-only references.
+DirectoriesToAlwaysCook=(Path="/Game/VFX")
+DirectoriesToAlwaysCook=(Path="/Game/Data/Audio")
+DirectoriesToAlwaysCook=(Path="/Game/Data/VFX")
; The packaged combat path resolves the enemy skeletal mesh and rifle clips
; through soft object paths. Keep the project-owned character body and its
; locomotion/event animations in the cooked build so standalone play does not
; silently downgrade to the disconnected modular fallback rig.
+DirectoriesToAlwaysCook=(Path="/Game/Characters")
; Keep the exact project mannequin subtree explicit as well. This prevents
; soft-object-only enemy mesh and rifle animation references from being
; dropped by platform-specific cook dependency filtering.
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Mannequins")
; Enemy weapon meshes are resolved by role at runtime from soft object paths.
; Keep the authored firearm directory in cooked builds instead of falling
; back to the procedural silhouette when the game target is packaged.
+DirectoriesToAlwaysCook=(Path="/Game/Weapons")
; Serialized weapon profiles own balance and presentation references. They are
; loaded through soft paths, so retain the data directory in cooked builds.
+DirectoriesToAlwaysCook=(Path="/Game/Data/Weapons")
+DirectoriesToAlwaysCook=(Path="/Game/Data/Throwables")
; Saved mission/multiplayer shells are replaceable map content and must be
; retained in cooked/staged builds alongside their runtime directors.
+DirectoriesToAlwaysCook=(Path="/Game/Levels")
; Explicit map entries prevent a non-default authored arena from being
; omitted by platform cook rules that only retain referenced packages.
+MapsToCook=(FilePath="/Game/Levels/Glasswake")
+MapsToCook=(FilePath="/Game/Levels/SignalControl")
